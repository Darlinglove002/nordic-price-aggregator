[project]
name = "nordic-price-aggregator"
version = "0.1.0"
description = "Async price & stock aggregator for Nordic web shops: httpx + BeautifulSoup, PostgreSQL history, Telegram digest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13,<2",
    "aiogram>=3.10,<4",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*", "mock_shop*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ['ignore:Dialect sqlite\+aiosqlite does \*not\* support Decimal']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# T20: no print() in package code (use logging). The one-off `sync` command prints its report to
# stdout on purpose; those two calls carry an inline noqa. The benchmark prints its table.
select = ["E", "F", "I", "B", "UP", "T20"]
ignore = ["E501"]  # line wrapping is owned by `ruff format`

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["T201"]

[tool.mypy]
python_version = "3.11"
files = ["app", "mock_shop"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

# APScheduler 3.x ships no type information.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
