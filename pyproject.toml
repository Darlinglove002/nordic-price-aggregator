[project]
name = "nordic-price-aggregator"
version = "0.1.0"
description = "Async price & stock aggregator for Nordic web shops: httpx + BeautifulSoup, PostgreSQL history, Telegram digest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13,<2",
    "aiogram>=3.10,<4",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*", "mock_shop*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ['ignore:Dialect sqlite\+aiosqlite does \*not\* support Decimal']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line wrapping is owned by `ruff format`
